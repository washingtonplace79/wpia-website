<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Publish Staging · Washington Place</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #15201d;
        --muted: #5c6864;
        --line: #d6ddd9;
        --surface: #ffffff;
        --accent: #2a9d8f;
        --accent-dark: #1d6f66;
        --danger: #b42318;
        --bg: #f4f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 520px);
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgb(21 32 29 / 10%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: 700 1rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        font-weight: 650;
      }

      .status[data-kind="error"] {
        color: var(--danger);
      }

      .status[data-kind="success"] {
        color: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Publish staging</h1>
      <p>Starts the release workflow for reviewed staging changes. Production rebuilds only when staging has something new.</p>

      <form id="publish-form">
        <label for="secret">Publish passcode</label>
        <input id="secret" name="secret" type="password" autocomplete="current-password" required />
        <button type="submit">Publish to live site</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      const form = document.querySelector("#publish-form");
      const button = form.querySelector("button");
      const status = document.querySelector("#status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        status.dataset.kind = "";
        status.textContent = "Publishing...";

        try {
          const secret = new FormData(form).get("secret");
          const response = await fetch("/.netlify/functions/publish", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${secret}`,
            },
          });
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.message || payload.error || "Publish failed.");
          }

          status.dataset.kind = "success";
          status.textContent = payload.message || "Release workflow started.";
          form.reset();
        } catch (error) {
          status.dataset.kind = "error";
          status.textContent = error.message || "Publish failed.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
